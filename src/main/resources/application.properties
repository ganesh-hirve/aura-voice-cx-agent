spring.application.name=auraSkinCare
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:auradb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.api.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
gemini.api.read-timeout=${GEMINI_READ_TIMEOUT:30s}
gemini.api.max-tool-iterations=${GEMINI_MAX_TOOL_ITERATIONS:4}

sarvam.api.key=${SARVAM_API_KEY:}
sarvam.api.connect-timeout=${SARVAM_CONNECT_TIMEOUT:5s}
sarvam.api.read-timeout=${SARVAM_READ_TIMEOUT:30s}
